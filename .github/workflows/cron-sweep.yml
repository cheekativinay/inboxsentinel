name: 24/7 Deliverability Sweep Cron

on:
  schedule:
    # Run every 15 minutes (24/7 passive sweep)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Passive Deliverability Sweep
        run: |
          TARGET_URL="${{ secrets.SITE_URL || 'https://inboxsentinel.netlify.app' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET || '' }}"
          
          echo "Triggering 24/7 sweep on $TARGET_URL/api/cron/sweep..."
          if [ -n "$CRON_SECRET" ]; then
            curl -s -X POST "$TARGET_URL/api/cron/sweep" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json"
          else
            curl -s -X POST "$TARGET_URL/api/cron/sweep" \
              -H "Content-Type: application/json"
          fi
